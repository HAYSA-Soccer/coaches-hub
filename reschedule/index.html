<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Game Reschedule Workflow</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>

<body>

  <header class="header">
    <h1>HAYSA Game Reschedule</h1>
    <p class="subtitle">A guided workflow to move your SSSL game</p>
  </header>

  <!-- GAME NUMBER INPUT -->
  <section class="game-number-section card">
    <label for="gameNumberInput">Enter SSSL Game Number</label>
    <input type="text" id="gameNumberInput" placeholder="Example: 22920056">
    <button id="loadGameBtn" class="primary-btn">Load Game</button>
    <button id="clearGameBtn" class="secondary-btn">Clear</button>
    <p id="gameLoadMessage" class="info-text"></p>
  </section>

  <!-- TIMELINE -->
  <nav class="timeline">
    <div class="timeline-step" data-step="1">Original Game</div>
    <div class="timeline-step" data-step="2">Opponent</div>
    <div class="timeline-step" data-step="3">Field Hold</div>
    <div class="timeline-step" data-step="4">SSSL Form</div>
    <div class="timeline-step" data-step="5">Approval</div>
    <div class="timeline-step" data-step="6">Calendar</div>
    <div class="timeline-step" data-step="7">Notify</div>
  </nav>

  <!-- DYNAMIC PANEL -->
  <section id="panelContainer" class="panel card">
    <!-- JS will inject content here -->
  </section>

  <!-- NEXT STEP BUTTON -->
  <div class="next-step-container">
    <button id="nextStepBtn" class="primary-btn">Next Step →</button>
  </div>

</body>
</html>

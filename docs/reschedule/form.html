<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Change Form</title>
  <link rel="stylesheet" href="styles.css">

  <!-- PDF-LIB for PDF generation -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <!-- Main JS + PDF JS -->
  <script src="main.js" defer></script>
  <script src="pdf.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    canvas {
      border: 1px solid #000;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>SSSL Game Change Form</h1>
  <p>Please complete all fields below. Your PDF will download automatically.</p>

  <form id="gameChangeForm">

    <!-- GAME NUMBER -->
    <label>SSSL Game Number</label>
    <input type="text" name="game_number" id="game_number" required>

    <!-- TEAM NAME -->
    <label>Team Name</label>
    <input type="text" name="team_name" id="team_name" required>

    <!-- ORIGINAL GAME DETAILS (READ-ONLY) -->
    <label>Original Game Date</label>
    <input type="date" name="orig_date" id="orig_date" readonly>

    <label>Original Game Time</label>
    <input type="time" name="orig_time" id="orig_time" readonly>

    <label>Original Game Field</label>
    <input type="text" name="orig_field" id="orig_field" readonly>

    <!-- NEW GAME DETAILS -->
    <label>New Game Date</label>
    <input type="date" name="final_date" id="final_date" required>

    <label>New Game Time</label>
    <input type="time" name="final_time" id="final_time" required>

    <label>New Game Field</label>
    <input type="text" name="final_field" id="final_field" required>

    <!-- PRIVATE FIELDS (NOT STORED) -->
    <h2>Coach Information (Not Stored)</h2>

    <label>Initiating Coach Name</label>
    <input type="text" name="coach_name" id="coach_name" required>

    <label>Initiating Coach Email</label>
    <input type="email" name="coach_email" id="coach_email" required>

    <label>Initiating Coach Phone</label>
    <input type="tel" name="coach_phone" id="coach_phone" required>

    <label>Opponent Coach Name</label>
    <input type="text" name="opp_coach_name" id="opp_coach_name" required>

    <label>Opponent Coach Phone</label>
    <input type="tel" name="opp_coach_phone" id="opp_coach_phone" required>

    <!-- SIGNATURE PAD -->
    <h2>Signature</h2>
    <p>Please sign below:</p>

    <canvas id="signaturePad" width="400" height="150"></canvas>
    <button type="button" id="clearSignature">Clear Signature</button>

    <!-- SUBMIT -->
    <button type="submit">Generate PDF & Save</button>

  </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Game Reschedule</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <h1>HAYSA Game Reschedule</h1>
    <div class="subtitle">A guided workflow to move your SSSL game</div>
  </div>

  <!-- LOOKUP CARD -->
  <section class="card" id="lookupContainer">
    <h2>Lookup Game</h2>

    <label>Enter SSSL Game Number</label>
    <input type="text" id="lookupGameNumber" placeholder="e.g., 22920056">

    <button class="primary-btn" onclick="lookupGameNumber()">Lookup</button>

    <div id="lookupStatus" class="info-text"></div>
  </section>

  <!-- TIMELINE (Horizontal) -->
  <div id="timelineContainer" style="display:none;">
    <div class="timeline-step" data-step="1">Start</div>
    <div class="timeline-step" data-step="2">Original</div>
    <div class="timeline-step" data-step="3">Opponent</div>
    <div class="timeline-step" data-step="4">New Details</div>
    <div class="timeline-step" data-step="5">Field Hold</div>
    <div class="timeline-step" data-step="6">HAYSA</div>
    <div class="timeline-step" data-step="7">SSSL Form</div>
    <div class="timeline-step" data-step="8">Calendar</div>
    <div class="timeline-step" data-step="9">Finalize</div>
  </div>

  <!-- PANEL -->
  <section class="card panel fade-in" id="panelContainer" style="display:none;">
    <!-- JS injects step content here -->
  </section>

  <!-- NEXT STEP BUTTON -->
  <div id="nextStepContainer" class="next-step-container" style="display:none;">
    <button id="nextStepBtn" class="primary-btn">Next Step →</button>
  </div>

  <!-- GAME CHANGE FORM (Step 7 only) -->
  <section class="card" id="formSection" style="display:none;">
    <h2>Game Change Form</h2>

    <form id="gameChangeForm">

      <label>Game Number</label>
      <input type="text" name="game_number" id="form_game_number">

      <label>Team Name</label>
      <input type="text" name="team_name">

      <label>Original Date</label>
      <input type="date" name="orig_date">

      <label>Original Time</label>
      <input type="time" name="orig_time">

      <label>Original Field</label>
      <input type="text" name="orig_field">

      <label>Final Date</label>
      <input type="date" name="final_date">

      <label>Final Time</label>
      <input type="time" name="final_time">

      <label>Final Field</label>
      <input type="text" name="final_field">

      <label>Coach Name</label>
      <input type="text" name="coach_name">

      <label>Coach Email</label>
      <input type="email" name="coach_email">

      <label>Coach Phone</label>
      <input type="tel" name="coach_phone">

      <label>Opposing Coach Name</label>
      <input type="text" name="opp_coach_name">

      <label>Opposing Coach Phone</label>
      <input type="tel" name="opp_coach_phone">

      <h3>Coach Signature</h3>
      <canvas id="signaturePad"></canvas>
      <button type="button" id="clearSignature" class="secondary-btn">Clear Signature</button>

      <br><br>
      <button type="submit" class="primary-btn">Save Form</button>

    </form>
  </section>

  <script src="main.js"></script>
</body>
</html>

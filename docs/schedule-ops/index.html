<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HAYSA Schedule Operations</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#1d3557;
}

.header{
    background:#173f7a;
    color:white;
    text-align:center;
    padding:30px;
}

.header h1{
    margin:0;
}

.header p{
    margin-top:10px;
}

.container{
    max-width:1400px;
    margin:25px auto;
    padding:0 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h3{
    margin:0;
    color:#666;
    font-size:14px;
    text-transform:uppercase;
}

.value{
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

.good{
    color:#2e7d32;
}

.warning{
    color:#ff8f00;
}

.bad{
    color:#d32f2f;
}

.section{
    background:white;
    border-radius:12px;
    padding:22px;
    margin-top:25px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section h2{
    margin-top:0;
}

.progress{
    background:#e0e0e0;
    height:28px;
    border-radius:18px;
    overflow:hidden;
}

.progress-fill{
    width:100%;
    height:100%;
    background:#2e7d32;
    color:white;
    font-weight:bold;
    text-align:center;
    line-height:28px;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
}

.team-card{
    background:#f7f9fb;
    border-radius:8px;
    padding:12px;
    font-weight:bold;
}

.issue-card{
    background:#fff6f6;
    border-left:6px solid #d32f2f;
    padding:14px;
    margin-bottom:15px;
    border-radius:6px;
}

.issue-title{
    font-weight:bold;
    color:#d32f2f;
    margin-bottom:5px;
}

.small{
    color:#777;
    font-size:14px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#2e7d32;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
    <h1>⚙️ HAYSA Schedule Operations</h1>
    <p>SSSL & TeamSideline Synchronization Dashboard</p>
</div>

<div class="container">

    <!-- TOP METRICS -->

    <div class="cards">

        <div class="card">
            <h3>Status</h3>
            <div
                class="value good"
                id="statusCard">
                Healthy
            </div>
        </div>

        <div class="card">
            <h3>Last Sync</h3>
            <div
                class="value"
                id="lastSync">
                Loading...
            </div>
        </div>

        <div class="card">
            <h3>Coverage</h3>
            <div
                class="value"
                id="coverage">
                88 / 88
            </div>
        </div>

        <div class="card">
            <h3>Open Issues</h3>
            <div
                class="value bad"
                id="issueCount">
                0
            </div>
        </div>

    </div>

    <!-- COVERAGE -->

    <div class="section">

        <h2>Coverage Progress</h2>

        <p>
            TeamSideline synchronization coverage.
        </p>

        <div class="progress">
            <div
                class="progress-fill"
                id="coverageBar">
                100%
            </div>
        </div>

    </div>

    <!-- TEAM STATUS -->

    <div class="section">

        <h2>Team Status</h2>

        <div
            id="teamStatus"
            class="team-grid">

            <div class="team-card">
                ✅ Loading...
            </div>

        </div>

    </div>

    <!-- ACTIONS -->

    <div class="section">

        <h2>Action Required</h2>

        <div id="issuesContainer">

            <div class="empty">
                Loading schedule data...
            </div>

        </div>

    </div>

</div>

<script>

fetch("../data/schedule-status.json")
    .then(response => response.json())
    .then(data => {

        render(data);

    })
    .catch(error => {

        console.error(error);

    });

function render(data){

    document.getElementById(
        "statusCard"
    ).innerText = data.status;

    document.getElementById(
        "lastSync"
    ).innerText = data.lastSync;

    document.getElementById(
        "coverage"
    ).innerText =
        data.tsGames +
        " / " +
        data.ssslGames;

    const issueCount =
        data.create +
        data.update +
        data.review;

    document.getElementById(
        "issueCount"
    ).innerText =
        issueCount;

    document.getElementById(
        "coverageBar"
    ).style.width =
        data.coverage + "%";

    document.getElementById(
        "coverageBar"
    ).innerText =
        data.coverage + "%";

    let teamHtml = "";

    data.teams.forEach(team => {

        const icon =
            team.status === "good"
            ? "✅"
            : "⚠️";

        teamHtml += `
            <div class="team-card">
                ${icon} ${team.name}
            </div>
        `;

    });

    document.getElementById(
        "teamStatus"
    ).innerHTML =
        teamHtml;

    let issueHtml = "";

    if(data.issues.length === 0){

        issueHtml =
            '<div class="empty">✅ No action required.</div>';

    }else{

        data.issues.forEach(issue => {

            issueHtml += `
                <div class="issue-card">
            
                    <div class="issue-title">
                        ${issue.status}
                    </div>
            
                    <strong>
                        ${issue.team}
                    </strong>
            
                    <br>
            
                    vs ${issue.opponent}
            
                    <br><br>
            
                    ${issue.sssl_date}
                    &nbsp;•&nbsp;
                    ${issue.sssl_time}
            
                    <br>
            
                    Field:
                    ${issue.sssl_field}
            
                    <br><br>
            
                    <strong>
                        Action:
                    </strong>
            
                    ${issue.action_required}
            
                </div>
            `;

        });

    }

    document.getElementById(
        "issuesContainer"
    ).innerHTML =
        issueHtml;
}

</script>

</body>
</html>
